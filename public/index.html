<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#493765">
  <title>速報記録 | SOKUHO</title>
  <script>
    const githubPagesBase = location.hostname.endsWith('.github.io')
      ? `/${location.pathname.split('/').filter(Boolean)[0] || 'sokuho_result.com'}/`
      : '/';
    document.write(`<base href="${githubPagesBase}">`);
  </script>
  <script src="config.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #2e2840;
      --muted: #77718a;
      --line: #e1dbea;
      --paper: #ffffff;
      --canvas: #f6f3fa;
      --forest: #66518a;
      --forest-dark: #493765;
      --lime: #d8c8ed;
      --coral: #b44f69;
      --blue: #e9e2f4;
      font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding-bottom: calc(86px + env(safe-area-inset-bottom)); background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .masthead { background: var(--forest-dark); color: white; border-bottom: 4px solid var(--lime); }
    .masthead-inner { width: min(1120px, calc(100% - 36px)); margin: auto; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; letter-spacing: 0; }
    .sokuho-logo { display: block; width: 176px; height: auto; }
    .masthead-partners { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
    .tsukuba-logo { display: block; width: 108px; height: auto; }
    .nishi-support { display: grid; justify-items: start; gap: 4px; color: #e2d9ed; font-size: 9px; font-weight: 700; line-height: 1; text-decoration: none; white-space: nowrap; }
    .nishi-logo { display: block; width: 76px; height: auto; }
    main { width: min(1120px, calc(100% - 36px)); margin: 30px auto 60px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--forest); font-size: 11px; font-weight: 800; letter-spacing: 0; text-transform: uppercase; }
    h1 { margin: 6px 0 0; font-size: clamp(24px, 5vw, 36px); line-height: 1.2; }
    .intro-copy { max-width: 380px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .panel { border: 1px solid var(--line); background: var(--paper); }
    .create-layout { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 760px; }
    .create-form { padding: clamp(22px, 5vw, 42px); }
    .section-title { margin: 0 0 21px; font-size: 18px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label { color: #514968; font-size: 12px; font-weight: 700; }
    .field input, .field textarea, .field select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #d5cde0; border-radius: 2px; background: white; color: var(--ink); outline: none; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--forest); box-shadow: 0 0 0 2px rgba(102,81,138,.14); }
    .primary, .secondary, .danger { min-height: 42px; border: 0; padding: 0 17px; font-size: 13px; font-weight: 800; }
    .primary { background: var(--forest); color: white; }.primary:hover { background: #51406f; }
    .secondary { border: 1px solid #cfc5dc; background: white; color: var(--forest); }
    .danger { background: #f6e5df; color: #873e30; }
    .wide { width: 100%; }
    .error { min-height: 20px; margin: 9px 0 0; color: #a63d2d; font-size: 12px; }
    .race-head { padding: 20px 24px; background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--forest); }
    .race-heading { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
    .race-heading h1 { font-size: clamp(23px, 4vw, 31px); }
    .race-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .viewer-badge { display: inline-block; padding: 3px 8px; border: 1px solid #cfc5dc; color: var(--forest); font-size: 10px; font-weight: 800; }
    .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .stats { display: flex; gap: 26px; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .stat { display: flex; align-items: baseline; gap: 7px; color: var(--muted); font-size: 11px; }
    .stat strong { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 25px 0 10px; }
    .toolbar-left { display: flex; align-items: end; gap: 12px; }
    .toolbar .field { margin: 0; min-width: 210px; }
    .toolbar .field label { font-size: 11px; }
    .toolbar select { min-height: 38px; padding: 7px 10px; }
    .live-state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #82908a; }
    .live-state.connected .live-dot { background: #3a9d68; box-shadow: 0 0 0 3px #dcefe1; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); background: white; }
    table { width: 100%; border-collapse: collapse; min-width: 730px; font-size: 13px; }
    th { height: 38px; padding: 8px 12px; background: #eee9f5; color: #514968; text-align: left; font-size: 11px; font-weight: 800; white-space: nowrap; }
    td { height: 54px; padding: 8px 12px; border-top: 1px solid #ece7f1; }
    tbody tr:hover { background: #faf8fc; }
    .lane { width: 65px; text-align: center; font-variant-numeric: tabular-nums; }
    .lane-number { display: inline-grid; width: 26px; height: 26px; place-items: center; background: var(--blue); color: #554373; font-weight: 800; }
    .athlete-name { font-weight: 800; }.team { color: var(--muted); font-size: 12px; }
    .result-time { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 800; }
    .place { display: inline-block; min-width: 32px; color: var(--forest); font-size: 11px; font-weight: 800; }
    .status { color: var(--muted); font-size: 11px; }.status.finished { color: var(--forest); font-weight: 700; }
    .record-button { min-height: 34px; padding: 0 12px; border: 1px solid var(--forest); background: white; color: var(--forest); font-size: 11px; font-weight: 800; }
    .record-button:disabled { border-color: #ddd8e4; color: #a39daf; cursor: default; }
    .start-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; border: 1px solid var(--line); border-top: 0; background: #faf8fc; }
    .start-copy strong { display: block; font-size: 13px; }.start-copy span { color: var(--muted); font-size: 11px; }
    .start-button { min-width: 160px; min-height: 48px; background: var(--coral); color: white; font-size: 14px; }
    .start-button:disabled { background: #aaa4b5; cursor: default; }
    .empty { padding: 36px 20px; border: 1px solid var(--line); background: white; text-align: center; color: var(--muted); font-size: 13px; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 15px; }
    .footnote { display: flex; justify-content: space-between; gap: 20px; margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    dialog { width: min(560px, calc(100% - 28px)); max-height: min(90vh, 760px); padding: 0; border: 1px solid var(--line); background: white; color: var(--ink); }
    dialog::backdrop { background: rgba(39, 29, 55, .55); }
    .dialog-head, .dialog-body, .dialog-actions { padding: 18px 22px; }
    .dialog-head { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 18px; }.dialog-body { max-height: 65vh; overflow: auto; }
    .dialog-actions { display: flex; justify-content: end; gap: 9px; border-top: 1px solid var(--line); }
    textarea { min-height: 145px; resize: vertical; line-height: 1.7; }
    .hint { margin: -7px 0 14px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .auth-wrap { width: min(520px, 100%); margin: 34px auto 0; }
    .auth-panel { border-top: 4px solid var(--forest); }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid var(--line); }
    .auth-tabs button { min-height: 48px; border: 0; border-right: 1px solid var(--line); background: #f5f2f9; color: var(--muted); font-size: 12px; font-weight: 800; }
    .auth-tabs button:last-child { border-right: 0; }
    .auth-tabs button[aria-selected="true"] { background: white; color: var(--forest); box-shadow: inset 0 -3px var(--forest); }
    .auth-form { padding: clamp(22px, 5vw, 36px); }
    .auth-form h2 { margin: 0 0 7px; font-size: 21px; }
    .auth-description, .viewer-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .auth-description { margin: 0 0 23px; }
    .viewer-note { margin: 16px 0 0; text-align: center; }
    .dashboard-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
    .dashboard-heading h1 { font-size: 28px; }
    .dashboard-heading .intro-copy { margin: 8px 0 0; }
    .dashboard-list { margin-top: 28px; }
    .dashboard-list h2, .admin-table h2 { font-size: 17px; }
    .admin-stats { display: flex; gap: 28px; margin: 20px 0; padding: 18px; border-block: 1px solid var(--line); }
    .admin-table { margin-top: 28px; }
    .portal-list { display: grid; gap: 12px; margin-top: 14px; }
    .portal-item { padding: 16px; border: 1px solid var(--line); background: white; }
    .portal-item.important-item { border: 1px solid #e6a1b2; border-left: 5px solid #d83362; background: #fff1f4; }
    .important-label { display: inline-block; margin-left: 6px; padding: 3px 8px; background: #d83362; color: white; font-size: 10px; font-weight: 800; vertical-align: middle; }
    .important-dialog { border: 2px solid #d83362; box-shadow: 0 18px 60px rgba(114, 22, 52, .25); }
    .important-dialog .dialog-head { background: #fff1f4; color: #8d173b; }
    .important-dialog .dialog-body { display: grid; gap: 12px; }
    .important-dialog-item { padding: 14px; border: 1px solid #e6a1b2; border-left: 5px solid #d83362; background: #fff7f8; }
    .important-dialog-item h3 { margin: 0 0 6px; font-size: 16px; }
    .important-dialog-item p { margin: 10px 0 0; white-space: pre-wrap; line-height: 1.7; }
    .checkbox-field { display: flex; align-items: center; gap: 9px; margin: 0 0 17px; color: #514968; font-size: 13px; font-weight: 700; }
    .checkbox-field input { width: 18px; height: 18px; accent-color: #d83362; }
    .portal-item h3 { margin: 0 0 7px; font-size: 15px; }
    .portal-item p { white-space: pre-wrap; line-height: 1.65; }
    .portal-meta { color: var(--muted); font-size: 11px; }
    .race-url { overflow-wrap: anywhere; }
    .portal-message { margin: 12px 0; padding: 10px 12px; background: #f5f2f9; font-size: 12px; white-space: pre-wrap; }
    .portal-message.admin-message { background: #eee9f5; }
    .portal-actions { display: flex; align-items: end; gap: 10px; margin-top: 12px; }
    .portal-actions .field { flex: 1; margin: 0; }
    .portal-item .field textarea { min-height: 90px; }
    .status-label { display: inline-block; padding: 3px 8px; background: #eee9f5; color: var(--forest); font-size: 10px; font-weight: 800; }
    .athlete-edit-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
    .athlete-edit-row .field { min-width: 0; margin: 0; }
    .athlete-edit-row .field label { font-size: 10px; }
    .athlete-edit-row .field input { min-width: 0; }
    .athlete-edit-row .remove-athlete { min-height: 36px; padding-inline: 9px; }
    .athlete-edit-row .finish-edit { grid-column: 1 / 4; }
    .event-schedule { color: var(--muted); font-size: 11px; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .audit-entry { padding: 14px; border: 1px solid var(--line); background: white; }
    .audit-entry h3 { margin: 0 0 6px; font-size: 14px; }
    .audit-entry pre { max-height: 180px; overflow: auto; margin: 8px 0 0; padding: 10px; background: #f5f2f9; font: inherit; font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .group-panel { margin: 18px 0; padding: 18px 20px; border: 1px solid var(--line); background: white; }
    .group-panel-head { display: flex; align-items: start; justify-content: space-between; gap: 18px; }
    .group-panel h2 { margin: 0; font-size: 15px; }
    .group-owner, .group-member-detail { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .group-invite-form { display: flex; align-items: end; gap: 10px; margin-top: 14px; }
    .group-invite-form .field { flex: 1; margin: 0; }
    .group-members { display: grid; gap: 0; margin: 14px 0 0; padding: 0; list-style: none; }
    .group-members li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .group-member-name { font-size: 13px; font-weight: 800; }
    .group-role { display: inline-block; margin-left: 6px; color: var(--forest); font-size: 10px; font-weight: 700; }
    .group-panel .error { margin-top: 8px; }
    .sponsor-bar { position: fixed; z-index: 30; right: 0; bottom: 0; left: 0; min-height: 68px; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: rgba(255,255,255,.97); box-shadow: 0 -4px 18px rgba(73,55,101,.08); }
    .sponsor-bar-inner { display: flex; align-items: center; justify-content: center; gap: 24px; width: min(1120px, calc(100% - 36px)); min-height: 68px; margin: auto; }
    .sponsor-label { color: var(--muted); font-size: 10px; font-weight: 800; }
    .sponsor-list { display: flex; align-items: center; gap: 26px; }
    .sponsor-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; color: #202020; text-decoration: none; }
    .sponsor-link img { display: block; object-fit: contain; }
    .sponsor-newbalance img, .sponsor-github img { width: 26px; height: 26px; }
    .sponsor-cramer img { width: 108px; height: 27px; }
    .sponsor-name { font-size: 12px; font-weight: 800; white-space: nowrap; }
    .mobile-only { display: none; }
    @keyframes page-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    #app.page-enter { animation: page-enter 220ms ease-out both; }
    @media (max-width: 700px) {
      .masthead-inner, main { width: min(100% - 24px, 1120px); }
      .masthead-inner { min-height: 58px; gap: 8px; }
      .brand { gap: 8px; font-size: 13px; }
      .sokuho-logo { width: 132px; }
      .masthead-partners { gap: 10px; }
      .tsukuba-logo { width: 78px; }
      .nishi-support { font-size: 8px; }
      .nishi-logo { width: 54px; }
      main { margin-top: 20px; }
      .intro { display: block; }.intro-copy { margin-top: 10px; }
      .create-layout { grid-template-columns: minmax(0, 1fr); }
      .race-head { padding: 17px; }.race-heading { display: block; }.head-actions { margin-top: 15px; }.stats { justify-content: space-between; gap: 8px; }
      .toolbar { align-items: stretch; flex-direction: column; }.toolbar-left { align-items: stretch; }.toolbar .field { min-width: 0; flex: 1; }.toolbar .primary { flex-shrink: 0; padding: 0 11px; }
      .toolbar-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }.toolbar-actions button { padding-inline: 8px; }
      .athlete-edit-row { grid-template-columns: 1fr 1fr; }.athlete-edit-row .finish-edit { grid-column: 1 / -1; }
      .start-bar { align-items: stretch; flex-direction: column; }.start-button { width: 100%; }
      .dashboard-heading { align-items: start; flex-direction: column; }.dashboard-heading .intro-copy { margin-top: 4px; }
      .admin-stats { justify-content: space-between; gap: 10px; padding-inline: 8px; }
      .group-panel { padding: 15px; }
      .group-panel-head { flex-direction: column; }
      .group-invite-form { align-items: stretch; flex-direction: column; }
      .group-invite-form .primary { width: 100%; }
      .table-wrap { overflow: visible; border: 0; background: transparent; }
      table { min-width: 0; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
      tbody { display: grid; gap: 9px; }
      tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 7px 10px; border: 1px solid var(--line); background: white; }
      tbody td { display: grid; align-content: center; gap: 3px; min-width: 0; height: auto; min-height: 38px; padding: 7px 4px; border-top: 1px solid #ece7f1; overflow-wrap: anywhere; }
      tbody td::before { content: attr(data-label); color: var(--muted); font-size: 10px; font-weight: 700; }
      tbody td:first-child { border-top: 0; }
      tbody td .danger, tbody td button { justify-self: start; }
      .lane { width: auto; text-align: left; }
      .footnote { display: block; }.footnote span { display: block; margin-top: 5px; }
      body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
      .sponsor-bar, .sponsor-bar-inner { min-height: 64px; }
      .sponsor-bar-inner { justify-content: space-between; gap: 8px; width: calc(100% - 20px); }
      .sponsor-label { font-size: 9px; }
      .sponsor-list { justify-content: space-between; flex: 1; gap: 8px; }
      .sponsor-link { gap: 4px; min-height: 36px; }
      .sponsor-newbalance img, .sponsor-github img { width: 21px; height: 21px; }
      .sponsor-cramer img { width: 74px; height: 20px; }
      .sponsor-name { font-size: 10px; }
      .mobile-only { display: inline; }
    }
    @media (prefers-reduced-motion: reduce) { #app.page-enter { animation-duration: 1ms; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./" aria-label="SOKUHO ホーム"><img class="sokuho-logo" src="sokuho-logo.svg" alt="SOKUHO"></a>
      <div class="masthead-partners" aria-label="協力">
        <a href="https://www.tsukuba.ac.jp/" target="_blank" rel="noopener noreferrer" aria-label="筑波大学">
          <img class="tsukuba-logo" src="tsukuba-logo.svg" alt="筑波大学">
        </a>
        <a class="nishi-support" href="https://www.nishi.com/" target="_blank" rel="noopener noreferrer" aria-label="supported by NISHI">
          <span>supported by</span>
          <img class="nishi-logo" src="nishi-logo.svg" alt="NISHI">
        </a>
      </div>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="sponsor-bar" aria-label="スポンサー">
    <div class="sponsor-bar-inner">
      <span class="sponsor-label">協賛</span>
      <div class="sponsor-list">
        <a class="sponsor-link sponsor-newbalance" href="https://www.newbalance.com/" target="_blank" rel="noopener noreferrer" aria-label="New Balance">
          <img src="newbalance.svg" alt=""><span class="sponsor-name">New Balance</span>
        </a>
        <a class="sponsor-link sponsor-cramer" href="https://www.cramer.co.jp/" target="_blank" rel="noopener noreferrer" aria-label="Cramer Japan">
          <img src="cramer-japan.gif" alt="Cramer Japan">
        </a>
        <a class="sponsor-link sponsor-github" href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <img src="github-mark.png" alt=""><span class="sponsor-name">GitHub</span>
        </a>
      </div>
    </div>
  </footer>
  <dialog id="event-dialog">
    <form id="event-form">
      <div class="dialog-head"><h2>競技を追加</h2><button class="secondary" type="button" data-close>閉じる</button></div>
      <div class="dialog-body">
        <div class="field"><label for="event-name">競技名</label><input id="event-name" name="name" placeholder="男子 100m" required maxlength="60"></div>
        <div class="field"><label for="event-round">ラウンド・組</label><input id="event-round" name="round" placeholder="予選 1組" maxlength="30"></div>
        <div class="field"><label for="event-scheduled-at">予定開始時刻</label><input id="event-scheduled-at" name="scheduledAt" type="datetime-local" step="1"></div>
        <div class="field"><label for="event-started-at">実際のスタート時刻（訂正用）</label><input id="event-started-at" name="startedAt" type="datetime-local" step="0.001"></div>
        <div class="field"><strong>選手名簿</strong><span class="hint">同じ大会に登録済みの選手名・所属・学年は候補に表示されます。新しい値も入力できます。</span></div>
        <div id="athlete-edit-list"></div>
        <button class="secondary" id="append-athlete-row" type="button">選手を追加</button>
        <datalist id="athlete-name-options"></datalist>
        <datalist id="athlete-team-options"></datalist>
        <datalist id="athlete-grade-options">
          <option value="小1"><option value="小2"><option value="小3"><option value="小4"><option value="小5"><option value="小6">
          <option value="中1"><option value="中2"><option value="中3">
          <option value="高1"><option value="高2"><option value="高3">
          <option value="大1"><option value="大2"><option value="大3"><option value="大4">
          <option value="一般"><option value="その他">
        </datalist>
        <p class="hint">フィニッシュ済み選手の記録は秒単位で修正できます。記録がある競技の編集時は変更内容を確認します。</p>
        <p class="error" id="event-error" role="alert"></p>
      </div>
      <div class="dialog-actions"><button class="primary" id="save-event-button" type="submit">競技を登録</button></div>
    </form>
  </dialog>
  <dialog id="important-announcement-dialog" class="important-dialog" aria-labelledby="important-announcement-title">

  <script>
    const app = document.querySelector('#app');
    const eventDialog = document.querySelector('#event-dialog');
    const importantAnnouncementDialog = document.querySelector('#important-announcement-dialog');
    const APP_BASE_PATH = document.querySelector('base').getAttribute('href').replace(/\/$/, '');
    const API_BASE_URL = String(window.SOKUHO_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
    const API_KEY = String(window.SOKUHO_CONFIG?.anonKey || '');
    let race = null;
    let selectedEventId = null;
    let editingEventId = null;
    let clockOffset = 0;
    let racePollTimer = null;
    let routeToken = 0;
    let currentUser = null;
    let raceAccess = { canManage: false, isOwner: false, isCollaborator: false };
    let currentGroup = null;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[character]);

    function pageUrl(path = '/') {
      const route = path.startsWith('/') ? path : `/${path}`;
      return `${APP_BASE_PATH}${route}` || '/';
    }

    function routePath() {
      const pathname = location.pathname;
      return APP_BASE_PATH && pathname.startsWith(`${APP_BASE_PATH}/`)
        ? pathname.slice(APP_BASE_PATH.length)
        : pathname === APP_BASE_PATH ? '/' : pathname;
    }

    async function request(url, options = {}) {
      const headers = { 'content-type': 'application/json', ...(options.headers || {}) };
      if (API_KEY) headers.apikey = API_KEY;
      const sessionToken = localStorage.getItem('sokuho_session');
      if (sessionToken) headers['x-sokuho-session'] = sessionToken;
      const endpoint = API_BASE_URL && url.startsWith('/api/') ? `${API_BASE_URL}${url}` : url;
      const response = await fetch(endpoint, {
        ...options,
        headers,
      });
      const updatedSession = response.headers.get('x-sokuho-session');
      if (updatedSession !== null) {
        if (updatedSession) localStorage.setItem('sokuho_session', updatedSession);
        else localStorage.removeItem('sokuho_session');
      }
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '通信に失敗しました');
      return result;
    }

    async function syncClock() {
      const samples = [];
      for (let attempt = 0; attempt < 3; attempt += 1) {
        const before = Date.now();
        const result = await request('/api/time');
        const after = Date.now();
        samples.push({ offset: result.serverTime - (before + after) / 2, delay: after - before });
      }
      clockOffset = samples.sort((left, right) => left.delay - right.delay)[0].offset;
    }

    function currentEvent() {
      return race?.events.find((item) => item.id === selectedEventId) || race?.events[0] || null;
    }

    function formatTime(milliseconds) {
      if (!Number.isFinite(milliseconds) || milliseconds < 0) return '--.--';
      const centiseconds = Math.floor(milliseconds / 10);
      const seconds = Math.floor(centiseconds / 100);
      return `${seconds}.${String(centiseconds % 100).padStart(2, '0')}`;
    }

    function resultFor(event, athlete) {
      return athlete.finishedAt && event.startedAt ? athlete.finishedAt - event.startedAt : null;
    }

    function auditSnapshotSummary(snapshot) {
      if (Array.isArray(snapshot)) return snapshot.map((event) => `${event.name}${event.round ? ` (${event.round})` : ''}`).join(' → ');
      if (!snapshot || typeof snapshot !== 'object') return '';
      const start = snapshot.startedAt ? new Date(snapshot.startedAt).toLocaleString('ja-JP') : '未記録';
      const scheduled = snapshot.scheduledAt ? new Date(snapshot.scheduledAt).toLocaleString('ja-JP') : '未設定';
      const athletes = (snapshot.athletes || []).map((athlete) => {
        const time = athlete.finishedAt && snapshot.startedAt
          ? `${((athlete.finishedAt - snapshot.startedAt) / 1000).toFixed(2)}秒`
          : '未記録';
        return `- ${athlete.lane}レーン ${athlete.name} / ${athlete.team || '所属なし'} / ${athlete.grade || '学年なし'} / ${time}`;
      });
      return [
        `${snapshot.name}${snapshot.round ? ` (${snapshot.round})` : ''}`,
        `予定開始: ${scheduled}`,
        `スタート: ${start}`,
        ...athletes,
      ].join('\n');
    }

    async function submitAuth(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const mode = event.currentTarget.dataset.mode;
      const payload = { email: form.get('email'), password: form.get('password') };
      if (mode === 'register') payload.name = form.get('name');
      try {
        const result = await request(`/api/auth/${mode === 'register' ? 'register' : 'login'}`, {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        if (mode === 'admin' && result.user.role !== 'admin') {
          await request('/api/auth/logout', { method: 'POST', body: '{}' });
          renderAuth('admin', false, '管理者アカウントではありません。');
          return;
        }
        currentUser = result.user;
        const destination = currentUser.role === 'admin' ? '/admin' : '/';
        history.pushState({ role: currentUser.role }, '', pageUrl(destination));
        await showHome(true);
      } catch (failure) {
        const error = document.querySelector('#auth-error');
        if (error) error.textContent = failure.message;
      }
    }

      currentUser = null;

    async function showHome(animate = false) {
      const currentRouteToken = ++routeToken;
      clearTimeout(racePollTimer);
      racePollTimer = null;
      race = null;
      selectedEventId = null;
      try {
        const auth = await request('/api/auth/me');
        if (currentRouteToken !== routeToken) return;
        currentUser = auth.user;
        if (routePath() === '/login') {
          renderAuth('login', animate);
          return;
        }
        if (!currentUser) {
          renderAuth(routePath() === '/admin' ? 'admin' : 'login', animate);
          return;
        }
        if (currentUser.role === 'organizer' && currentUser.mustChangePassword) {
          renderPasswordChange(animate);
          return;
        }
        if (currentUser.role === 'admin') {
          if (routePath() !== '/admin') history.replaceState({ role: 'admin' }, '', pageUrl('/admin'));
          const summary = await request('/api/admin/summary');
          if (currentRouteToken === routeToken) renderAdmin(summary, animate);
          return;
        }
        if (routePath() === '/admin') history.replaceState({}, '', pageUrl('/'));
        const [races, portal] = await Promise.all([
          request('/api/races'),
          request('/api/organizer/portal'),
        ]);
        if (currentRouteToken === routeToken) renderOrganizer(races, portal, animate);
      } catch (failure) {
        if (currentRouteToken === routeToken) app.innerHTML = `<div class="empty"><strong>ページを読み込めませんでした</strong>${escapeHtml(failure.message)}</div>`;
      }
    }

    function renderRace(animate = false) {
      const event = currentEvent();
      const selectedId = event?.id || '';
      const selectedAthletes = event?.athletes || [];
      const finishedCount = selectedAthletes.filter((athlete) => athlete.finishedAt).length;
      const started = Boolean(event?.startedAt);
      const canManage = raceAccess.canManage;
      const currentEventIndex = race.events.findIndex((item) => item.id === event?.id);
      const rankings = [...selectedAthletes].filter((athlete) => athlete.finishedAt)
        .sort((left, right) => resultFor(event, left) - resultFor(event, right));
      const placeByAthlete = new Map(rankings.map((athlete, index) => [athlete.id, index + 1]));
      const rows = selectedAthletes.map((athlete) => {
        const duration = resultFor(event, athlete);
        const canFinish = started && !athlete.finishedAt;
        return `<tr>
          <td class="lane" data-label="レーン"><span class="lane-number">${athlete.lane}</span></td>
          <td data-label="選手名"><span class="athlete-name">${escapeHtml(athlete.name)}</span></td>
          <td class="team" data-label="所属">${escapeHtml(athlete.team || '—')}</td>
          <td data-label="学年">${escapeHtml(athlete.grade || '—')}</td>
          <td data-label="記録"><span class="place">${athlete.finishedAt ? `${placeByAthlete.get(athlete.id)}着` : '—'}</span><span class="result-time">${duration === null ? '—' : formatTime(duration)}</span></td>
          <td data-label="状況"><span class="status ${athlete.finishedAt ? 'finished' : ''}">${athlete.finishedAt ? 'フィニッシュ' : started ? '競技中' : '未スタート'}</span></td>
          ${canManage ? `<td data-label="操作"><button class="record-button" data-finish="${athlete.id}" ${canFinish ? '' : 'disabled'}>${athlete.finishedAt ? '記録済み' : 'FINISH'}</button></td>` : ''}
        </tr>`;
      }).join('');

      app.innerHTML = `
        <section class="race-head">
          <div class="race-heading"><div><div class="eyebrow">大会速報</div><h1>${escapeHtml(race.title)}</h1><div class="race-meta"><span>${escapeHtml(race.date || '開催日未設定')}</span><span>${escapeHtml(race.venue || '会場未設定')}</span>${canManage ? '' : '<span class="viewer-badge">閲覧専用</span>'}</div></div><div class="head-actions">${canManage ? '<button class="secondary" id="dashboard-button">運営者ページ</button>' : ''}<button class="secondary" id="share-button">共有URLをコピー</button></div></div>
          <div class="stats"><div class="stat"><strong>${race.events.length}</strong>競技</div><div class="stat"><strong>${event ? selectedAthletes.length : 0}</strong>出走</div><div class="stat"><strong>${finishedCount}</strong>記録</div></div>
        </section>
        ${renderGroupPanel()}
        <section class="toolbar"><div class="toolbar-left"><div class="field"><label for="event-select">競技・組</label><select id="event-select" ${race.events.length ? '' : 'disabled'}>${race.events.length ? race.events.map((item) => `<option value="${item.id}" ${item.id === selectedId ? 'selected' : ''}>${escapeHtml(item.name)}${item.round ? `　${escapeHtml(item.round)}` : ''}${item.scheduledAt ? ` ・ ${new Date(item.scheduledAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}予定` : ''}</option>`).join('') : '<option>競技を登録してください</option>'}</select></div><span class="live-state" id="connection-state"><i class="live-dot"></i><span>接続中...</span></span></div>${canManage ? `<div class="toolbar-actions"><button class="primary" id="add-event">競技を追加</button>${event ? `<button class="secondary" id="edit-event">競技・選手を編集</button><button class="secondary" id="export-results">CSV出力</button><button class="secondary" id="move-event-up" ${currentEventIndex <= 0 ? 'disabled' : ''}>競技を上へ</button><button class="secondary" id="move-event-down" ${currentEventIndex >= race.events.length - 1 ? 'disabled' : ''}>競技を下へ</button>` : ''}</div>` : ''}</section>
        ${event?.scheduledAt ? `<p class="event-schedule">予定開始：${new Date(event.scheduledAt).toLocaleString('ja-JP')}</p>` : ''}
        ${event ? `<section aria-label="競技速報"><div class="table-wrap"><table><thead><tr><th class="lane">ﾚｰﾝ</th><th>選手名</th><th>所属</th><th>学年</th><th>記録</th><th>状況</th>${canManage ? '<th>操作</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>${canManage ? `<div class="start-bar"><div class="start-copy"><strong>${started ? event.status === 'complete' ? '全員フィニッシュ' : 'レース進行中' : 'スタート待機中'}</strong><span>${started ? `スタート時刻を記録済み　/　${finishedCount} of ${selectedAthletes.length} finish` : 'スタート地点でスタートを記録してください'}</span></div><button class="primary start-button" id="start-button" ${started ? 'disabled' : ''}>${started ? 'START RECORDED' : 'スタートを記録'}</button></div>` : ''}</section>` : `<div class="empty"><strong>競技がまだ登録されていません</strong>${canManage ? '「競技を追加」から最初の組と出走選手を登録してください。' : '大会運営者が競技を登録すると、ここに速報が表示されます。'}</div>`}

      document.querySelector('#dashboard-button')?.addEventListener('click', () => {
        history.pushState({}, '', pageUrl('/'));

    async function recordTime(action, athleteId) {
      const event = currentEvent();
      if (!event) return;
      const actionButton = action === 'start' ? document.querySelector('#start-button') : document.querySelector(`[data-finish="${athleteId}"]`);
      if (actionButton) actionButton.disabled = true;
      try {
        await request(`/api/races/${encodeURIComponent(race.id)}/${action}`, {
          method: 'POST',
          body: JSON.stringify({ eventId: event.id, athleteId, clientTime: Date.now() + clockOffset }),
        });
      } catch (failure) {
        if (actionButton) actionButton.disabled = false;
        window.alert(failure.message);
      }
    }

    function toLocalDateTime(value) {
      if (!value) return '';
      const date = new Date(value);
      const pad = (part, size = 2) => String(part).padStart(size, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${pad(date.getMilliseconds(), 3)}`;
    }

    function rosterValues(field) {
      return [...new Set(race.events.flatMap((item) => item.athletes.map((athlete) => athlete[field]).filter(Boolean)))];
    }

    function renderAthleteRows(athletes = [], withTimes = false, startedAt = null) {
      const container = document.querySelector('#athlete-edit-list');
      const allAthletes = athletes.length ? athletes : [{}];
      document.querySelector('#athlete-name-options').innerHTML = rosterValues('name').map((item) => `<option value="${escapeHtml(item)}">`).join('');
      document.querySelector('#athlete-team-options').innerHTML = rosterValues('team').map((item) => `<option value="${escapeHtml(item)}">`).join('');
      container.innerHTML = allAthletes.map((athlete) => athleteRowMarkup(athlete, withTimes, startedAt)).join('');
    }

    function athleteRowMarkup(athlete = {}, withTimes = false, startedAt = null) {
      const elapsed = athlete.finishedAt && startedAt
        ? ((athlete.finishedAt - startedAt) / 1000).toFixed(2)
        : '';
      return `<div class="athlete-edit-row">
          <input type="hidden" name="athleteId" value="${escapeHtml(athlete.id || '')}">
          <div class="field"><label>選手名</label><input name="athleteName" list="athlete-name-options" value="${escapeHtml(athlete.name || '')}" required maxlength="50"></div>
          <div class="field"><label>所属</label><input name="athleteTeam" list="athlete-team-options" value="${escapeHtml(athlete.team || '')}" maxlength="50"></div>
          <div class="field"><label>学年</label><input name="athleteGrade" list="athlete-grade-options" value="${escapeHtml(athlete.grade || '')}" maxlength="30"></div>
          ${withTimes ? `<div class="field finish-edit"><label>記録（秒・空欄で未記録）</label><input name="athleteFinish" type="number" min="0" step="0.01" value="${elapsed}"></div>` : ''}
          <button class="danger remove-athlete" type="button" aria-label="選手を削除">削除</button>
        </div>`;
    }

    function openNewEventEditor() {
      editingEventId = null;
      const form = document.querySelector('#event-form');
      form.reset();
      form.elements.startedAt.value = '';
      document.querySelector('#event-form h2').textContent = '競技を追加';
      document.querySelector('#save-event-button').textContent = '競技を登録';
      document.querySelector('#event-error').textContent = '';
      renderAthleteRows();
      eventDialog.showModal();
    }

    function openExistingEventEditor(event) {
      editingEventId = event.id;
      const form = document.querySelector('#event-form');
      form.elements.name.value = event.name;
      form.elements.round.value = event.round || '';
      form.elements.scheduledAt.value = toLocalDateTime(event.scheduledAt);
      form.elements.startedAt.value = toLocalDateTime(event.startedAt);
      document.querySelector('#event-form h2').textContent = '競技・選手・記録を編集';
      document.querySelector('#save-event-button').textContent = '変更を保存';
      document.querySelector('#event-error').textContent = '';
      renderAthleteRows(event.athletes, true, event.startedAt);
      eventDialog.showModal();
    }

    async function addEvent(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const startedAt = event.currentTarget.elements.startedAt.value
        ? new Date(event.currentTarget.elements.startedAt.value).getTime()
        : null;
      const scheduledAt = event.currentTarget.elements.scheduledAt.value
        ? new Date(event.currentTarget.elements.scheduledAt.value).getTime()
        : null;
      const athletes = [...document.querySelectorAll('#athlete-edit-list .athlete-edit-row')]
        .map((row) => {
          const finishInput = row.querySelector('[name="athleteFinish"]');
          const elapsed = finishInput?.value === '' ? null : Number(finishInput?.value);
          return {
            id: row.querySelector('[name="athleteId"]').value || undefined,
            name: row.querySelector('[name="athleteName"]').value.trim(),
            team: row.querySelector('[name="athleteTeam"]').value.trim(),
            grade: row.querySelector('[name="athleteGrade"]').value.trim(),
            finishedAt: elapsed === null ? null : startedAt + elapsed * 1000,
          };
        })
        .filter((athlete) => athlete.name);
      const error = document.querySelector('#event-error');
      try {
        if (!athletes.length) throw new Error('選手を1名以上入力してください');
        if (athletes.length > 12) throw new Error('1競技に登録できる選手は12名までです');
        if (editingEventId) {
          const current = race.events.find((item) => item.id === editingEventId);
          if ((current.startedAt || current.athletes.some((item) => item.finishedAt))
            && !window.confirm('スタート・フィニッシュ記録を含む競技情報を変更します。変更前後は履歴に記録されます。保存しますか？')) return;
          const result = await request(`/api/races/${encodeURIComponent(race.id)}/events/${encodeURIComponent(editingEventId)}`, {
            method: 'PATCH',
            body: JSON.stringify({
              name: form.get('name'),
              round: form.get('round'),
              startedAt,
              scheduledAt,
              athletes,
            }),
          });
          race = result.race;
          selectedEventId = editingEventId;
        } else {
          const result = await request(`/api/races/${encodeURIComponent(race.id)}/events`, {
            method: 'POST',
            body: JSON.stringify({ name: form.get('name'), round: form.get('round'), scheduledAt, athletes }),
          });
          race = result.race;
          selectedEventId = result.event.id;
        }
        editingEventId = null;
        eventDialog.close();
        renderRace();
      } catch (failure) {
        error.textContent = failure.message;
      }
    }

    async function moveEvent(direction) {
      const currentIndex = race.events.findIndex((item) => item.id === selectedEventId);
      const targetIndex = currentIndex + direction;
      if (currentIndex < 0 || targetIndex < 0 || targetIndex >= race.events.length) return;
      const eventIds = race.events.map((item) => item.id);
      [eventIds[currentIndex], eventIds[targetIndex]] = [eventIds[targetIndex], eventIds[currentIndex]];
      try {
        const result = await request(`/api/races/${encodeURIComponent(race.id)}/events/order`, {
          method: 'PATCH',
          body: JSON.stringify({ eventIds }),
        });
        race = result.race;
        renderRace();
      } catch (failure) {
        window.alert(failure.message);
      }
    }

    function exportRaceCsv() {
      const quote = (value) => `"${String(value ?? '').replaceAll('"', '""')}"`;
      const rows = [['大会', '開催日', '会場', '競技', '組', '予定開始', 'レーン', '選手', '所属', '学年', '記録秒', '着順', '状態']];
      for (const event of race.events) {
        const ranked = event.athletes.filter((athlete) => athlete.finishedAt)
          .sort((left, right) => left.finishedAt - right.finishedAt);
        const placeById = new Map(ranked.map((athlete, index) => [athlete.id, index + 1]));
        for (const athlete of event.athletes) {
          rows.push([
            race.title,
            race.date,
            race.venue,
            event.name,
            event.round,
            event.scheduledAt ? new Date(event.scheduledAt).toLocaleString('ja-JP') : '',
            athlete.lane,
            athlete.name,
            athlete.team,
            athlete.grade,
            athlete.finishedAt && event.startedAt ? ((athlete.finishedAt - event.startedAt) / 1000).toFixed(2) : '',
            placeById.get(athlete.id) || '',
            athlete.finishedAt ? 'フィニッシュ' : event.startedAt ? '競技中' : '未スタート',
          ]);
        }
      }
      const csv = `\uFEFF${rows.map((row) => row.map(quote).join(',')).join('\r\n')}`;
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `${race.title.replace(/[\\/:*?"<>|]/g, '_')}-results.csv`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function loadRace(id, animate = false) {
      const currentRouteToken = ++routeToken;
      clearTimeout(racePollTimer);
      racePollTimer = null;
      try {
        const auth = await request('/api/auth/me');
        if (currentRouteToken !== routeToken) return;
        currentUser = auth.user;
        await syncClock();
        const snapshot = await request(`/api/races/${encodeURIComponent(id)}/snapshot`);
        if (currentRouteToken !== routeToken) return;
        race = snapshot.race;
        raceAccess = snapshot.access;
        currentGroup = snapshot.group;
        selectedEventId = race.events[0]?.id || null;
        renderRace(animate);
        pollRace(id, currentRouteToken);
      } catch (failure) {
        if (currentRouteToken !== routeToken) return;
        app.innerHTML = `<div class="empty"><strong>大会を開けませんでした</strong>${escapeHtml(failure.message)}<p><a href="${pageUrl('/')}">大会トップへ戻る</a></p></div>`;
      }
    }

    async function pollRace(id, currentRouteToken) {
      try {
        const snapshot = await request(`/api/races/${encodeURIComponent(id)}/snapshot`);
        if (currentRouteToken !== routeToken) return;
        const raceChanged = JSON.stringify(snapshot.race) !== JSON.stringify(race);
        const accessChanged = JSON.stringify(snapshot.access) !== JSON.stringify(raceAccess);
        const groupChanged = JSON.stringify(snapshot.group) !== JSON.stringify(currentGroup);
        race = snapshot.race;
        raceAccess = snapshot.access;
        currentGroup = snapshot.group;
        if (raceChanged || accessChanged || groupChanged) {
          if (!race.events.some((item) => item.id === selectedEventId)) selectedEventId = race.events[0]?.id || null;
          renderRace();
        }
        const state = document.querySelector('#connection-state');
        if (state) { state.classList.add('connected'); state.lastElementChild.textContent = '同期中'; }
      } catch (failure) {
        if (currentRouteToken !== routeToken) return;
        if (failure.message === '大会が見つかりません') {
          app.innerHTML = '<div class="empty"><strong>この大会は削除されました</strong>大会運営者に新しい速報URLをご確認ください。</div>';
          return;
        }
        const state = document.querySelector('#connection-state');
        if (state) { state.classList.remove('connected'); state.lastElementChild.textContent = '再接続中'; }
      }
      if (currentRouteToken === routeToken) {
        racePollTimer = setTimeout(() => pollRace(id, currentRouteToken), 15000);
      }
    }

    function showCurrentRoute(animate = false) {
      const pathMatch = routePath().match(/^\/r\/([A-Za-z0-9_-]{12})$/);
      const legacyId = new URLSearchParams(location.search).get('race');
      const raceId = pathMatch?.[1] || legacyId;
      if (legacyId && !pathMatch) {
        history.replaceState({ raceId: legacyId }, '', pageUrl(`/r/${encodeURIComponent(legacyId)}`));
      }
      if (raceId) {
        loadRace(raceId, animate);
      } else {
        showHome(animate);
      }
    }

    document.querySelectorAll('[data-close]').forEach((button) => button.addEventListener('click', () => eventDialog.close()));
    document.querySelector('#event-form').addEventListener('submit', addEvent);
    document.querySelector('#append-athlete-row').addEventListener('click', () => {
      document.querySelector('#athlete-edit-list').insertAdjacentHTML('beforeend', athleteRowMarkup());
    });
    document.querySelector('#athlete-edit-list').addEventListener('click', (event) => {
      const removeButton = event.target.closest('.remove-athlete');
      if (removeButton) removeButton.closest('.athlete-edit-row').remove();
    });
    window.addEventListener('popstate', () => showCurrentRoute(true));
    showCurrentRoute();
    setInterval(() => { syncClock().catch(() => {}); }, 300000);
  </script>
</body>
</html>
